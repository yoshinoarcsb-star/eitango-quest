<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>授業コンソール</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#4a3019;--wood2:#8a5a33;--wood-ink:#f6e7cc;--wood-sub:#d9c3a0;
  --board:#1c4a3c;--board-d:#17372e;--chalk:#f3f1e7;--sub:#b9d3c6;--line:#3b6657;
  --yellow:#ffe27a;--blue:#8fd3ff;--pink:#ffb3c1;--live:#ff7a66;
  --ink:var(--chalk);--ng:var(--pink);--ok:var(--blue);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --serif:"Klee One","Yu Mincho",serif}
/* 画面サイズに合わせて全体を拡大（大型ディスプレイ向け）。右上の「文字」で微調整できます */
html{font-size:calc(clamp(18px,1.25vw,34px) * var(--zoom,1))}
*{box-sizing:border-box}
body{margin:0;background:var(--wood);color:var(--chalk);font-family:var(--font);font-size:1rem;line-height:1.6;padding-bottom:7.5rem}
.hide{display:none!important}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* ヘッダー（木枠） */
.top{position:sticky;top:0;z-index:5;background:var(--wood);color:var(--wood-ink);display:flex;align-items:center;gap:.8rem 2rem;padding:.8rem 1.6rem;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:1.7rem;line-height:1.2}
.brand small{font-family:var(--font);font-weight:400;font-size:.8rem;color:var(--wood-sub);margin-left:.7rem}
.steps{display:flex;gap:.3rem;font-size:1rem;flex:1 1 auto;justify-content:center;flex-wrap:wrap}
.steps span{padding:.35rem 1.1rem;border-radius:.7rem;color:var(--wood-sub)}
.steps span.on{background:var(--yellow);color:#2a2208;font-weight:900}
.steps span.done{color:var(--wood-ink)}
.tools{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.live{display:none;align-items:center;gap:.5rem;font-weight:900;font-size:.95rem;color:#ffb4a8}
.live::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
.live.on{display:flex}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}
.hcode{font-size:.95rem;color:var(--wood-sub)}.hcode b{color:var(--wood-ink);font-size:1.3rem;letter-spacing:.12em}
.zoom{display:flex;align-items:center;gap:.3rem;font-size:.85rem;color:var(--wood-sub)}
.zoom button{min-width:2.4rem;min-height:2.4rem;border:2px solid #c4ab85;border-radius:.6rem;background:transparent;color:var(--wood-ink);font-weight:700}
.zoom button.on{background:var(--wood-ink);color:var(--wood);border-color:var(--wood-ink)}
.hbtn{min-height:2.6rem;padding:0 1.2rem}

/* 黒板 */
main{margin:0 1rem;background:var(--board);border:.55rem solid var(--wood2);border-radius:.8rem;padding:1.6rem 1.8rem;min-height:calc(100vh - 12rem)}
.panel{background:rgba(0,0,0,.16);border:2px dashed var(--line);border-radius:1rem;padding:1.4rem 1.6rem}
h2{margin:0 0 .3rem;font-family:var(--serif);font-weight:600;font-size:1.8rem}
h3{margin:0 0 .8rem;font-family:var(--serif);font-weight:600;font-size:1.4rem}
.hint{color:var(--sub);font-size:1rem;margin:0 0 1rem}

/* ボタン */
.btn{border:2px solid var(--sub);border-radius:.8rem;padding:.55rem 1.3rem;font-weight:700;background:transparent;color:var(--chalk);min-height:3rem}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.main{background:var(--yellow);border-color:var(--yellow);color:#2a2208;font-size:1.35rem;font-weight:900;padding:.7rem 2.2rem;min-height:3.6rem}
.btn.main:hover{filter:brightness(.95);background:var(--yellow)}
.btn.ok{background:var(--blue);border-color:var(--blue);color:#0f2b36}
.btn.text{background:none;border-color:transparent;color:var(--wood-sub);text-decoration:underline;font-weight:400}
.btn.danger{background:#d9505a;border-color:#d9505a;color:#fff}
.btn.mini{min-height:2.4rem;padding:.2rem .9rem;font-size:.9rem;border-radius:.6rem}
.btn.main.ready{animation:glow 1.2s infinite;box-shadow:0 0 0 0 #ffe27aaa}
@keyframes glow{70%{box-shadow:0 0 0 1rem #ffe27a00}}
@media (prefers-reduced-motion:reduce){.btn.main.ready{animation:none;background:var(--blue);border-color:var(--blue)}}
.btn:disabled{opacity:.5;cursor:default}

/* 準備 */
.setup-head{margin-bottom:1.2rem}
.setup-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.4rem;align-items:stretch}
@media(max-width:960px){.setup-grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:1rem}
.card h3{display:flex;align-items:center;gap:.7rem}
.no{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;background:var(--yellow);color:#2a2208;font-family:var(--font);font-weight:900;font-size:1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
label.f{display:block;font-size:1rem;font-weight:700;margin-bottom:.3rem}
label.f small{font-weight:400;color:var(--sub);margin-left:.4rem}
input[type=text],input[type=number],select{width:100%;padding:.6rem .8rem;font:inherit;font-size:1.1rem;border:2px solid var(--sub);border-radius:.7rem;background:var(--chalk);color:#17372e}
.unit-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.unit-head label.f{margin:0;margin-right:auto}
.selinfo{font-size:.95rem;color:var(--yellow);font-weight:700}
.units{display:flex;flex-wrap:wrap;gap:.6rem;max-height:24rem;overflow:auto;padding:.2rem}
.units label{position:relative;display:flex;align-items:center;padding:.5rem 1.1rem;border:2px solid var(--line);border-radius:99px;cursor:pointer;font-size:1.05rem;min-height:2.8rem}
.units label:hover{border-color:var(--sub)}
.units label:has(input:checked){background:var(--yellow);border-color:var(--yellow);color:#2a2208;font-weight:700}
.units label:has(input:focus-visible){outline:3px solid var(--yellow);outline-offset:2px}
.units input{position:absolute;opacity:0;pointer-events:none}
.field{display:flex;flex-direction:column;gap:.4rem}
.fieldrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.fieldrow input{width:5.5rem;flex:0 0 auto;text-align:center}
.pre{min-height:2.6rem;padding:.2rem .9rem;border:2px solid var(--line);border-radius:99px;background:transparent;color:var(--chalk);font-size:.95rem}
.pre:hover{border-color:var(--sub)}
.pre.on{background:var(--chalk);color:#17372e;border-color:var(--chalk);font-weight:700}
details.more{border:2px dashed var(--line);border-radius:.8rem;padding:.4rem 1rem}
details.more summary{cursor:pointer;color:var(--sub);font-weight:700;padding:.3rem 0}
details.more .field{margin:.6rem 0}
.check{display:flex;gap:.6rem;align-items:center;font-size:1rem}
.check input{width:1.3rem;height:1.3rem;accent-color:var(--yellow)}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-top:auto;padding-top:1.1rem;border-top:2px dashed var(--line)}
.sum .n{margin-right:auto;color:var(--sub);font-size:1.1rem}.sum .n b{color:var(--chalk);font-family:var(--serif);font-size:2.4rem;font-weight:600;margin:0 .2rem}
.sum .msg{color:var(--pink);font-weight:700}
.btn.main.wide{flex:1 0 100%}

/* 入室待ち */
.hero{text-align:center;padding:2.4rem 1.6rem}
.hero .lead{color:var(--sub);margin:0;font-size:1.3rem}
.code{font-family:var(--serif);font-size:clamp(4rem,16vw,15rem);font-weight:600;letter-spacing:.12em;line-height:1.1;color:var(--yellow);font-variant-numeric:tabular-nums;margin:.4rem 0;padding-left:.12em}
.count{font-size:1.6rem;margin:.8rem 0}.count b{font-family:var(--serif);font-size:3.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.8rem}
.chip{background:#24586a;color:var(--chalk);padding:.3rem 1.1rem;border-radius:99px;font-size:1.25rem}

/* 出題中 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.4rem;align-items:stretch}
@media(max-width:1000px){.stage{grid-template-columns:1fr}}
.qbox{display:flex;flex-direction:column;gap:1rem}
.qhead{display:flex;justify-content:space-between;align-items:baseline;color:var(--sub)}
.qhead b{font-family:var(--serif);font-weight:600;font-size:1.7rem;color:var(--yellow)}
#sec{font-family:var(--serif);font-size:3.2rem;font-weight:600;color:var(--chalk);font-variant-numeric:tabular-nums;line-height:1}
.timer{height:.8rem;background:var(--line);border-radius:99px;overflow:hidden}.timer>div{height:100%;background:var(--yellow);width:100%;transition:width .2s linear;border-radius:99px}
.ja{font-family:var(--serif);font-weight:600;font-size:clamp(2.6rem,5vw,7rem);line-height:1.2;margin:1.2rem 0 .4rem;word-break:keep-all;overflow-wrap:anywhere}
.en{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,4.2vw,5.5rem);color:var(--blue);min-height:1.4em;letter-spacing:.03em}
.meter{margin-top:auto;padding-top:1rem;border-top:2px dashed var(--line)}
.meter .row{display:flex;gap:2.4rem;font-size:1.05rem;color:var(--sub);align-items:baseline}.meter .row b{font-family:var(--serif);font-weight:600;font-size:2.2rem;color:var(--chalk);font-variant-numeric:tabular-nums}
.bar{height:.9rem;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.6rem}.bar>div{height:100%;background:var(--blue);width:0;transition:width .4s;border-radius:99px}
.board-r{display:flex;flex-direction:column}
.legend{display:flex;gap:1.1rem;font-size:.95rem;color:var(--sub)}
.tilehead{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}.tilehead h3{margin:0}
/* 生徒の回答：大きく、遠くから読めるように */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.7rem;align-content:start;overflow-y:auto;max-height:calc(100vh - 20rem)}
.tile{position:relative;border:2px dashed #7fa395;background:transparent;border-radius:.8rem;padding:.7rem 3rem .7rem 1rem;min-height:5.6rem;font-size:1rem;color:var(--sub);word-break:break-all;display:flex;flex-direction:column;justify-content:center}
.tile b{display:block;font-size:1.5rem;line-height:1.3;color:var(--chalk);font-weight:900}
.tile.ok{background:#24586a;border:2px solid var(--blue);color:#cfeefc}
.tile.ng{background:#5b3340;border:2px solid var(--pink);color:#ffd9e0}
.tile.ok::after,.tile.ng::after{position:absolute;top:.3rem;right:.8rem;font-family:var(--serif);font-size:2.4rem;line-height:1.2;font-weight:600}
.tile.ok::after{content:"○";color:var(--blue)}
.tile.ng::after{content:"×";color:var(--pink)}
.tile i{font-style:normal;color:var(--pink);font-size:1.25rem;font-weight:700}

/* 結果 */
.res{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media(max-width:1000px){.res{grid-template-columns:1fr}}
.res .wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:1.1rem}
th{font-size:.95rem;color:var(--sub);text-align:left;font-weight:400}
td,th{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
td.rk{width:3rem;font-family:var(--serif);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
tr.top3 td.rk,tr.top3 td{color:var(--yellow)}
.tag{display:inline-block;background:#5b3340;color:#ffd9e0;padding:.15rem .8rem;border-radius:.6rem;margin:.2rem .4rem .2rem 0;font-size:1rem}
.tag.q{background:#24586a;color:var(--chalk)}
.good{color:var(--blue);font-weight:700}

/* 履歴 */
#history{position:fixed;inset:0;z-index:20;background:var(--board-d);overflow:auto}
.hwrap{max-width:1500px;margin:0 auto;padding:1.4rem 1.2rem 4rem}
.hbar{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:1.1rem}
.hbar h2{margin:0}.hbar .hint{margin:0}
.tabs{display:flex;gap:.3rem;margin-left:auto}
.tabs button{border:2px solid var(--line);background:transparent;color:var(--chalk);padding:.5rem 1.2rem;border-radius:99px;min-height:2.8rem}
.tabs button.on{background:var(--yellow);color:#2a2208;border-color:var(--yellow);font-weight:700}
details{border-bottom:1px solid var(--line);padding:.6rem 0}
summary{cursor:pointer;font-weight:700;font-size:1.1rem}summary small{font-weight:400;color:var(--sub);margin-left:.6rem}
.hline{margin:.4rem 0 0 1.2rem;font-size:1rem}.hline .d{color:var(--sub);font-size:.9rem;margin-right:.6rem}
.et{font-size:.85rem;color:var(--sub);margin-left:.3rem}
/* 操作バー（木の台） */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--wood);color:var(--wood-ink);border-top:4px solid var(--wood2);padding:.8rem 1.6rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.dock .st{margin-right:auto;font-weight:900;font-size:1.3rem}
.dock .st small{display:block;font-weight:400;font-size:.95rem;color:var(--wood-sub)}
.dock .btn{border-color:#c4ab85;color:var(--wood-ink);font-size:1.1rem}
.dock .btn:hover{background:rgba(255,255,255,.1)}
.dock .btn.main{background:var(--yellow);border-color:var(--yellow);color:#2a2208;font-size:1.4rem}
.dock .btn.danger{background:#d9505a;border-color:#d9505a;color:#fff}
.dock .btn.text{border-color:transparent;color:var(--wood-sub)}
@media(max-width:720px){.row2{grid-template-columns:1fr}}
</style></head><body>

<header class="top">
  <div class="brand">授業コンソール<small>英単語クエスト</small></div>
  <nav class="steps" id="steps"><span>準備</span><span>入室待ち</span><span>授業中</span><span>結果</span></nav>
  <div class="tools">
    <span class="live" id="liveTag">LIVE</span>
    <span class="hcode hide" id="hCodeW">参加コード <b id="hCode"></b></span>
    <div class="zoom" id="zoom" aria-label="文字サイズ">文字<button data-z="s" aria-label="文字を小さく">小</button><button data-z="m" aria-label="文字を標準に">中</button><button data-z="l" aria-label="文字を大きく">大</button></div>
    <button class="btn hbtn" id="histBtn">履歴</button>
  </div>
</header>

<main>
<!-- ① 準備 -->
<section id="setup">
  <div class="setup-head">
    <h2>授業をはじめる準備</h2>
    <p class="hint">① 出題する単元を選び、② 授業の設定を確認して「ルームを作成」を押します。作成すると生徒のホームに授業が表示されます。</p>
  </div>
  <div class="setup-grid">
    <div class="panel card">
      <h3><span class="no">1</span>出題する単元</h3>
      <div class="row2">
        <div><label class="f" for="tb">教材</label><select id="tb"><option value="sanseido">三省堂</option><option value="tokyo">東京書籍</option><option value="mitsumura">光村図書</option></select></div>
        <div><label class="f" for="grade">学年</label><select id="grade"></select></div>
      </div>
      <div>
        <div class="unit-head">
          <label class="f">単元<small>複数選べます</small></label>
          <span class="selinfo" id="selInfo"></span>
          <button type="button" class="btn mini" id="unitAll">すべて選ぶ</button>
          <button type="button" class="btn mini" id="unitNone">解除</button>
        </div>
        <div class="units" id="units"></div>
      </div>
    </div>

    <div class="panel card">
      <h3><span class="no">2</span>授業の設定</h3>
      <div class="field"><label class="f" for="title">授業タイトル</label><input id="title" type="text" placeholder="例：中2 Unit3 小テスト"></div>
      <div class="field"><label class="f" for="cnt">問題数</label>
        <div class="fieldrow"><input id="cnt" type="number" value="10" min="0">
          <button type="button" class="pre" data-set="cnt" data-v="5">5</button><button type="button" class="pre" data-set="cnt" data-v="10">10</button><button type="button" class="pre" data-set="cnt" data-v="20">20</button><button type="button" class="pre" data-set="cnt" data-v="0">すべて</button></div></div>
      <div class="field"><label class="f" for="tl">1問の制限時間（秒）</label>
        <div class="fieldrow"><input id="tl" type="number" value="30" min="0">
          <button type="button" class="pre" data-set="tl" data-v="15">15</button><button type="button" class="pre" data-set="tl" data-v="30">30</button><button type="button" class="pre" data-set="tl" data-v="60">60</button><button type="button" class="pre" data-set="tl" data-v="0">なし</button></div></div>
      <details class="more"><summary>詳細設定（ふだんは変更不要）</summary>
        <div class="field"><label class="f" for="school">校舎 <small>生徒の校舎と同じ表記。空欄なら全校舎</small></label><input id="school" type="text"></div>
        <div class="check"><input type="checkbox" id="heat"><label for="heat">授業のあと、生徒の苦手度に結果を反映する</label></div>
      </details>
      <div class="sum">
        <div class="n">出題数<b id="sumN">0</b>問</div>
        <span id="setupMsg" class="msg"></span>
        <button id="openBtn" class="btn main wide">ルームを作成</button>
      </div>
    </div>
  </div>
</section>

<!-- ② 入室待ち -->
<section id="lobby" class="panel hero hide">
  <p class="lead">生徒はホームの「授業参加モード」でこのコードを入力します</p>
  <div class="code" id="code"></div>
  <div class="count"><b id="pCount">0</b> 人が参加中</div>
  <div class="chips" id="pNames"></div>
</section>

<!-- ③ 授業中 -->
<section id="stage" class="stage hide">
  <div class="panel qbox">
    <div class="qhead"><b id="qHead"></b><span id="sec"></span></div>
    <div class="timer" id="timer"><div></div></div>
    <div class="ja" id="qJa"></div>
    <div class="en" id="qEn"></div>
    <div class="meter">
      <div class="row"><span>回答済み <b id="ansN">0</b> / <span id="ansT">0</span></span><span>正答率 <b id="acc">-</b></span></div>
      <div class="bar"><div id="accBar"></div></div>
    </div>
  </div>
  <div class="panel board-r"><div class="tilehead"><h3>みんなの回答</h3><div class="legend"><span>○ 正解</span><span>× 誤答</span><span>未回答は点線</span></div></div><div class="tiles" id="tiles"></div></div>
</section>

<!-- ④ 結果 -->
<section id="result" class="res hide">
  <div class="panel"><h3>順位</h3><table id="rank"></table></div>
  <div class="panel"><h3>誤答の多い単語</h3><div id="wordMiss"></div></div>
  <div class="panel wide"><h3>誰がどの問題を間違えたか</h3><table id="whoMiss"></table></div>
</section>
</main>

<div id="history" class="hide"><div class="hwrap">
  <div class="hbar"><h2>間違いの履歴</h2><span class="hint">直近30日</span>
    <div class="tabs" id="htabs"><button data-v="room" class="on">授業別</button><button data-v="stu">生徒別</button><button data-v="word">単語別</button></div>
    <button class="btn" id="csvBtn">CSV</button><button class="btn main" id="histClose" style="font-size:1.1rem;padding:.4rem 1.4rem;min-height:3rem">閉じる</button></div>
  <div class="panel" id="hbody">読み込み中…</div>
</div></div>

<div class="dock hide" id="dock"><div class="st" id="stLabel"></div><div id="ctrl" style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap"></div></div>

<script src="data_sanseido.js"></script>
<script src="data_tokyo.js"></script>
<script src="data_mitsumura.js"></script>
<script>
const URL_ = "https://sakkrwfnaromqzlfgatr.supabase.co/functions/v1/smart-service";
const KEY = "sb_publishable_MzlYHvTYTnO5plwIWU7Dnw_Wo8HuWK5";
/* 管理者合言葉：ここに直接書けば、入力は一切不要になります（このファイルは自分のPCだけに置き、GitHubには上げないこと）。
   空欄のままなら、最初の1回だけ入力を求め、以後はこのPCのブラウザに記憶します。 */
const FIXED_SECRET = "tomato03";
let secret = FIXED_SECRET || localStorage.getItem("eq_admin_secret");
if (!secret) { secret = prompt("管理者合言葉を入力してください（このPCに記憶されます）") || ""; localStorage.setItem("eq_admin_secret", secret); }
function api(p){
  return fetch(URL_,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},
    body:JSON.stringify(Object.assign({adminSecret:secret},p))}).then(r=>r.json()).then(r=>{
      if (r && r.message === "forbidden") { localStorage.removeItem("eq_admin_secret"); alert("管理者合言葉が違います。ページを再読み込みして入力し直してください。"); }
      return r; });
}
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let R = null, lastProg = {participants:[],answers:[]}, fullAt = 0;

/* ---- 準備 ---- */
function tbData(){ const t = window.TEXTBOOKS && window.TEXTBOOKS[$("tb").value]; return t || {courseData:{},courseOrder:{}}; }
function fillGrades(){
  const gs = new Set(); Object.values(tbData().courseData).forEach(o => Object.keys(o).forEach(g => gs.add(g)));
  $("grade").innerHTML = [...gs].map(g=>`<option>${g}</option>`).join(""); fillUnits();
}
function fillUnits(){
  const t = tbData(), g = $("grade").value;
  const list = (t.courseOrder && t.courseOrder[g]) || Object.keys(t.courseData);
  $("units").innerHTML = list.filter(u=>t.courseData[u] && t.courseData[u][g])
    .map(u=>`<label><input type="checkbox" value="${esc(u)}">${esc(u)}</label>`).join(""); sumUp();
}
function pickedWords(){
  const t = tbData(), g = $("grade").value; let ws = [];
  document.querySelectorAll("#units input:checked").forEach(i => ws = ws.concat(t.courseData[i.value][g]));
  return ws;
}
function sumUp(){ const n = +$("cnt").value, all = pickedWords().length; $("sumN").textContent = n > 0 ? Math.min(n, all) : all;
  const u = document.querySelectorAll("#units input:checked").length;
  $("selInfo").textContent = u ? "選択中 " + u + "単元・" + all + "語" : "";
  document.querySelectorAll(".pre").forEach(b => b.classList.toggle("on", $(b.dataset.set).value.trim() === b.dataset.v)); }
$("tb").onchange = fillGrades; $("grade").onchange = fillUnits; $("cnt").oninput = sumUp;
$("units").onchange = sumUp; $("tl").oninput = sumUp; fillGrades();
$("unitAll").onclick = () => { document.querySelectorAll("#units input").forEach(i => i.checked = true); sumUp(); };
$("unitNone").onclick = () => { document.querySelectorAll("#units input").forEach(i => i.checked = false); sumUp(); };
document.querySelectorAll(".pre").forEach(b => b.onclick = () => { $(b.dataset.set).value = b.dataset.v; sumUp(); });
sumUp();
/* 文字サイズ（大型ディスプレイ用）：小・中・大 */
const ZS = {s:.85, m:1, l:1.3};
function setZoom(k){ if (!ZS[k]) k = "m"; document.documentElement.style.setProperty("--zoom", ZS[k]);
  document.querySelectorAll("#zoom button").forEach(b => b.classList.toggle("on", b.dataset.z === k));
  try { localStorage.setItem("eq_live_zoom", k); } catch(e){} }
$("zoom").onclick = e => { const b = e.target.closest("button"); if (b) setZoom(b.dataset.z); };
try { setZoom(localStorage.getItem("eq_live_zoom") || "m"); } catch(e){ setZoom("m"); }

$("openBtn").onclick = async () => {
  let ws = pickedWords();
  if (!ws.length) { $("setupMsg").textContent = "単元を1つ以上選んでください"; return; }
  ws = ws.sort(()=>Math.random()-.5); const n = +$("cnt").value; if (n > 0) ws = ws.slice(0, n);
  const words = ws.map(w=>({id:w.id, en:w.english, ja:w.japanese}));
  $("openBtn").disabled = true; $("setupMsg").textContent = "作成中…";
  try {
    const r = await api({action:"classOpen", school:$("school").value.trim(), title:$("title").value.trim(),
      words, timeLimit:tlVal(), applyHeat:$("heat").checked});
    if (r.result !== "success") throw new Error(r.message || "サーバーエラー");
    R = {roomId:r.roomId, code:r.code, words, timeLimit:tlVal(), status:"lobby", idx:-1, startedAt:0};
    save(); enterRoom();
  } catch(e){ $("setupMsg").textContent = "作成できませんでした（" + e.message + "）"; $("openBtn").disabled = false; }
};
function tlVal(){ const v = $("tl").value.trim(); return v === "" ? 30 : Math.max(0, Math.round(+v) || 0); }
function save(){ sessionStorage.setItem("eq_live_room", JSON.stringify(R)); }

/* ---- ルーム ---- */
function enterRoom(){
  $("setup").classList.add("hide"); $("code").textContent = R.code; $("liveTag").classList.add("on"); $("hCode").textContent = R.code; $("hCodeW").classList.remove("hide");
  render(); poll(); setInterval(poll, 3000);
  api({action:"classHeartbeat", roomId:R.roomId}); setInterval(()=>api({action:"classHeartbeat", roomId:R.roomId}), 10000);
  setInterval(tick, 200);
}
async function ctl(op){
  if (op === "finish" && !confirm("授業を終了して結果を表示します。よろしいですか？")) return;
  const r = await api({action:"classControl", roomId:R.roomId, op});
  if (r.result === "success") {
    if (r.status) R.status = r.status;
    if (r.current_index !== undefined) R.idx = r.current_index;
    if (r.question_started_at) R.startedAt = Date.parse(r.question_started_at);
    save(); render(); poll();
  } else alert("操作できませんでした（" + (r.message||"通信エラー") + "）");
}
async function closeRoom(){
  if (!confirm("ルームを閉じます。生徒側の授業表示も消え、この結果画面には戻れません。よろしいですか？")) return;
  await api({action:"classClose", roomId:R.roomId}); sessionStorage.removeItem("eq_live_room"); location.reload();
}
const B = (t,cls,fn) => `<button class="btn ${cls}" onclick="${fn}">${t}</button>`;
function render(){
  const s = R.status, last = R.idx >= R.words.length - 1;
  const phase = s === "lobby" ? 1 : s === "finished" ? 3 : 2;
  document.querySelectorAll("#steps span").forEach((e,i)=>e.className = i === phase ? "on" : i < phase ? "done" : "");
  $("lobby").classList.toggle("hide", s !== "lobby");
  $("stage").classList.toggle("hide", !(phase === 2));
  $("result").classList.toggle("hide", s !== "finished");
  $("dock").classList.remove("hide");
  const lab = {lobby:["入室待ち","生徒が揃ったら開始してください"],question:["出題中","全員が回答したら次へ進めます"],
    reveal:["解答を表示中","解説のあとで次へ進めます"],paused:["一時停止中", R.timeLimit ? "再開すると制限時間が最初から始まります" : "再開すると続きから回答できます"],finished:["授業は終了しました","結果を確認したら、ルームを閉じてください"]}[s];
  $("stLabel").innerHTML = `${lab[0]}<small>${lab[1]}</small>`;
  let h = "";
  if (s === "lobby") h = B("授業を開始","main","ctl('start')");
  if (s === "question") h = B("一時停止","","ctl('pause')") + B("解答を表示","","ctl('reveal')") + B(last?"最後の問題を終える":"次の問題へ","main","ctl('next')");
  if (s === "reveal") h = B(last?"結果を見る":"次の問題へ","main","ctl('next')");
  if (s === "paused") h = B("再開","main","ctl('resume')");
  if (s === "finished") h = B("ルームを閉じる","danger","closeRoom()");
  else h += B("授業を終了","text","ctl('finish')");
  $("ctrl").innerHTML = h;
  const w = R.words[R.idx];
  if (w) { $("qHead").textContent = `第 ${R.idx+1} 問 / ${R.words.length}`; $("qJa").textContent = w.ja;
    $("qEn").textContent = s === "reveal" ? w.en : ""; }
  draw();
}
async function poll(){
  try {
    // 授業中は「今の問題」の回答だけ取得。全回答は、終了後に取得（以後は15秒ごと）
    const fin = R.status === "finished";
    if (fin && lastProg.full && Date.now() - fullAt < 15000) return;
    const body = {action:"classProgress", roomId:R.roomId};
    if (!fin) body.qIndex = R.idx;
    const r = await api(body);
    if (r.result !== "success") return;
    if (fin && r.full) fullAt = Date.now();
    lastProg = r;
    if (r.room && r.room.status && r.room.status !== "closed" && (r.room.status !== R.status || r.room.current_index !== R.idx)) {
      R.status = r.room.status; R.idx = r.room.current_index;
      if (r.room.question_started_at) R.startedAt = Date.parse(r.room.question_started_at);
      save(); render(); return;
    }
    draw();
  } catch(e){}
}
function draw(){
  const P = lastProg.participants || [], A = lastProg.answers || [];
  const nm = {}; P.forEach(p=>nm[p.student_number] = p.name || p.student_number);
  $("pCount").textContent = P.length;
  $("pNames").innerHTML = P.map(p=>`<span class="chip">${esc(nm[p.student_number])}</span>`).join("");
  const cur = A.filter(a=>a.q_index === R.idx), ok = cur.filter(a=>a.is_correct).length;
  $("ansN").textContent = cur.length; $("ansT").textContent = P.length;
  $("acc").textContent = cur.length ? Math.round(ok/cur.length*100) + "%" : "-";
  $("accBar").style.width = cur.length ? (ok/cur.length*100) + "%" : "0";
  const by = {}; cur.forEach(a=>by[a.student_number] = a);
  const showIn = R.status === "reveal";
  $("tiles").innerHTML = P.slice().sort((a,b)=>String(nm[a.student_number]).localeCompare(String(nm[b.student_number]),"ja"))
    .map(p=>{ const a = by[p.student_number];
      return `<div class="tile ${a?(a.is_correct?"ok":"ng"):""}"><b>${esc(nm[p.student_number])}</b>${a && !a.is_correct && showIn ? `<i>${esc(a.input||"（空欄）")}</i>` : (a?"回答済み":"…")}</div>`; }).join("");
  const all = R.status === "question" && P.length > 0 && cur.length >= P.length;
  const nb = document.querySelector("#ctrl .btn.main"); if (nb && R.status === "question") nb.classList.toggle("ready", all);
  const sm = $("stLabel").querySelector("small");
  if (sm && R.status === "question") sm.textContent = all ? "✅ 全員が回答しました。次へ進めます" : "全員が回答したら次へ進めます";
  if (R.status === "finished") { if (lastProg.full) drawResult(P, A, nm); else $("rank").innerHTML = "<tr><td>集計中…</td></tr>"; }
}
function drawResult(P, A, nm){
  const sc = {}; P.forEach(p=>sc[p.student_number] = {n:nm[p.student_number], c:0, t:0});
  A.forEach(a=>{ const s = sc[a.student_number]; if (s){ if (a.is_correct) s.c++; s.t += a.time_ms||0; } });
  const tot = Math.max(1, R.idx + 1);
  const rows = Object.values(sc).sort((a,b)=>b.c-a.c || a.t-b.t);
  $("rank").innerHTML = "<tr><th></th><th>名前</th><th>正答数</th><th>1問あたりの時間</th></tr>" +
    rows.map((s,i)=>`<tr class="${i<3?"top3":""}"><td class="rk">${i+1}</td><td>${esc(s.n)}</td><td>${s.c} / ${tot}</td><td>${(s.t/tot/1000).toFixed(1)}秒</td></tr>`).join("");
  const miss = {}; A.filter(a=>!a.is_correct).forEach(a=>miss[a.correct_answer] = (miss[a.correct_answer]||0)+1);
  $("wordMiss").innerHTML = Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,10)
    .map(([w,n])=>`<span class="tag">${esc(w)} ×${n}</span>`).join("") || '<span class="good">誤答はありませんでした</span>';
  const who = P.map(p=>{ const list = [];
    R.words.forEach((w,i)=>{ if (i > R.idx) return;
      const a = A.find(x=>x.student_number===p.student_number && x.q_index===i);
      if (!a) list.push({i,w,inp:null}); else if (!a.is_correct) list.push({i,w,inp:a.input}); });
    return {n:nm[p.student_number], list}; }).sort((x,y)=>y.list.length-x.list.length);
  $("whoMiss").innerHTML = "<tr><th>名前</th><th>間違えた問題（正解 ← 入力）</th></tr>" + who.map(s=>
    `<tr><td style="white-space:nowrap"><b>${esc(s.n)}</b><br>${s.list.length?s.list.length+"問":'<span class="good">全問正解</span>'}</td><td>` +
    s.list.map(m=>`<span class="tag">Q${m.i+1} ${esc(m.w.en)}${m.inp===null?"（未回答）":" ← "+esc(m.inp||"（空欄）")}</span>`).join("") + "</td></tr>").join("");
}
function tick(){
  const bar = $("timer");
  if (R.status !== "question" || !R.startedAt) { bar.firstElementChild.style.width = "100%"; $("sec").textContent = ""; return; }
  const el = (Date.now() - R.startedAt) / 1000;
  if (!R.timeLimit) { bar.style.display = "none"; $("sec").textContent = "経過 " + Math.floor(el) + "秒"; return; }
  bar.style.display = "";
  const left = R.timeLimit - el;
  bar.firstElementChild.style.width = Math.max(0, left / R.timeLimit * 100) + "%";
  $("sec").textContent = Math.max(0, Math.ceil(left)) + "秒";
}

/* ---- 履歴（いつ・だれが・何を間違えたか） ---- */
let LOG = null, hView = "room";
const ET = {missing:"脱字",extra:"余分",swap:"入れ替え",substitute:"置換"};
const fdt = t => new Date(t).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
$("histBtn").onclick = async () => {
  $("history").classList.remove("hide"); $("hbody").textContent = "読み込み中…";
  try {
    const r = await api({action:"classLog", days:30}); if (r.result !== "success") throw 0;
    const nm = {}; r.participants.forEach(p=>nm[p.room_id+"|"+p.student_number] = p.name || p.student_number);
    const rm = {}; r.rooms.forEach(x=>rm[x.id] = x);
    LOG = {rooms:r.rooms, parts:r.participants,
      rows:r.answers.map(a=>Object.assign({}, a, {name:nm[a.room_id+"|"+a.student_number] || a.student_number, room:rm[a.room_id] || {title:"", created_at:a.created_at}}))};
    showHist();
  } catch(e){ $("hbody").textContent = "読み込めませんでした。通信を確認して、もう一度開いてください。"; }
};
$("histClose").onclick = () => $("history").classList.add("hide");
$("htabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; hView = b.dataset.v;
  document.querySelectorAll("#htabs button").forEach(x=>x.classList.toggle("on", x === b)); showHist(); };
const mline = a => `<div class="hline"><span class="d">${fdt(a.created_at)}</span>${esc(a.correct_answer)} ← ${esc(a.input||"（空欄）")}<span class="et">${ET[a.error_type]||""}</span></div>`;
function showHist(){
  if (!LOG) return; const wrong = LOG.rows.filter(a=>!a.is_correct); let h = "";
  if (hView === "room") {
    h = LOG.rooms.map(rm=>{
      const rs = LOG.rows.filter(a=>a.room_id === rm.id), w = rs.filter(a=>!a.is_correct);
      const pc = LOG.parts.filter(p=>p.room_id === rm.id).length;
      if (!rs.length && !pc) return "";
      const by = {}; w.forEach(a=>(by[a.name] = by[a.name] || []).push(a));
      const body = Object.keys(by).map(n=>`<div style="margin-top:8px"><b>${esc(n)}</b>（${by[n].length}問）`+
        by[n].sort((x,y)=>x.q_index-y.q_index).map(a=>`<div class="hline"><span class="d">Q${a.q_index+1}</span>${esc(a.correct_answer)} ← ${esc(a.input||"（空欄）")}<span class="et">${ET[a.error_type]||""}</span></div>`).join("")+"</div>").join("") || '<div class="good" style="margin-top:8px">誤答はありませんでした</div>';
      return `<details><summary>${fdt(rm.created_at)}　${esc(rm.title||"（無題）")}<small>${pc}人　正答率${rs.length?Math.round((rs.length-w.length)/rs.length*100):0}%　誤答${w.length}</small></summary>${body}</details>`;
    }).join("");
  } else if (hView === "stu") {
    const g = {}; wrong.forEach(a=>(g[a.student_number] = g[a.student_number] || {n:a.name, l:[]}).l.push(a));
    h = Object.values(g).sort((a,b)=>b.l.length-a.l.length).map(s=>
      `<details><summary>${esc(s.n)}<small>誤答${s.l.length}件</small></summary>`+
      s.l.map(a=>`<div class="hline"><span class="d">${fdt(a.created_at)}</span><span class="d">${esc(a.room.title||"")}</span>${esc(a.correct_answer)} ← ${esc(a.input||"（空欄）")}<span class="et">${ET[a.error_type]||""}</span></div>`).join("")+"</details>").join("");
  } else {
    const g = {}; wrong.forEach(a=>(g[a.correct_answer] = g[a.correct_answer] || []).push(a));
    h = Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([w,l])=>
      `<details><summary>${esc(w)}<small>×${l.length}</small></summary>`+
      l.map(a=>`<div class="hline"><span class="d">${fdt(a.created_at)}</span>${esc(a.name)} ← ${esc(a.input||"（空欄）")}<span class="et">${ET[a.error_type]||""}</span></div>`).join("")+"</details>").join("");
  }
  $("hbody").innerHTML = h || "この期間の記録はまだありません";
}
$("csvBtn").onclick = () => {
  if (!LOG) return;
  const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const rows = [["日時","授業","生徒番号","名前","問題番号","正解","入力","正誤","誤りタイプ","回答時間(ms)"]].concat(
    LOG.rows.map(a=>[a.created_at, a.room.title, a.student_number, a.name, a.q_index+1, a.correct_answer, a.input, a.is_correct?"○":"×", ET[a.error_type]||"", a.time_ms]));
  const blob = new Blob(["\ufeff" + rows.map(r=>r.map(q).join(",")).join("\r\n")], {type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "class_log_" + new Date().toISOString().slice(0,10) + ".csv"; a.click();
};
/* リロード復帰 */
try { const s = sessionStorage.getItem("eq_live_room"); if (s) { R = JSON.parse(s); enterRoom(); } } catch(e){}
</script></body></html>
